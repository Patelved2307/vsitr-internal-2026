<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="200" height="220">
  <!-- KSV Blue Shield Logo -->
  <defs>
    <linearGradient id="ksvBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A2E8"/>
      <stop offset="100%" stop-color="#0072C6"/>
    </linearGradient>
  </defs>
  
  <!-- Outer Shield Boundary -->
  <path d="M 20,20 L 180,20 L 180,120 C 180,170 100,200 100,200 C 100,200 20,170 20,120 Z" fill="url(#ksvBlue)" stroke="#111111" stroke-width="4"/>
  
  <!-- Rays / Sunburst -->
  <g stroke="#FFFFFF" stroke-width="2.5" opacity="0.85">
    <line x1="100" y1="90" x2="100" y2="30"/>
    <line x1="100" y1="90" x2="40" y2="40"/>
    <line x1="100" y1="90" x2="160" y2="40"/>
    <line x1="100" y1="90" x2="30" y2="70"/>
    <line x1="100" y1="90" x2="170" y2="70"/>
    <line x1="100" y1="90" x2="50" y2="30"/>
    <line x1="100" y1="90" x2="150" y2="30"/>
    <line x1="100" y1="90" x2="75" y2="25"/>
    <line x1="100" y1="90" x2="125" y2="25"/>
    <line x1="100" y1="90" x2="35" y2="90"/>
    <line x1="100" y1="90" x2="165" y2="90"/>
  </g>
  
  <!-- Lamp / Flame Base -->
  <path d="M 65,135 C 65,115 135,115 135,135 C 120,150 80,150 65,135 Z" fill="#221F1F" stroke="#FFFFFF" stroke-width="2"/>
  <text x="100" y="132" text-anchor="middle" fill="#FFFFFF" font-family="'Arial Black', sans-serif" font-size="16" font-weight="bold" letter-spacing="4">KSV</text>
  
  <!-- Flame -->
  <path d="M 100,65 C 108,80 115,95 100,110 C 85,95 92,80 100,65 Z" fill="#FF7F27" stroke="#FFF" stroke-width="1.5"/>
  <path d="M 100,75 C 104,85 108,93 100,102 C 92,93 96,85 100,75 Z" fill="#FFC90E"/>

  <!-- Lower Ribbon -->
  <path d="M 15,180 Q 100,215 185,180 L 180,165 Q 100,200 20,165 Z" fill="#FFFFFF" stroke="#111111" stroke-width="2"/>
  <text x="100" y="182" text-anchor="middle" fill="#111" font-family="Arial, sans-serif" font-size="8.5" font-weight="bold">KADI SARVA VISHWAVDYALAYA</text>
</svg>
