<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- SIH Brain & Bulb Logo -->
  <g transform="translate(100, 85)">
    <!-- Bulb Base/Screw -->
    <path d="M-22,50 L22,50 M-18,58 L18,58 M-12,66 L12,66" stroke="#374151" stroke-width="4" stroke-linecap="round"/>
    <path d="M-8,66 Q0,76 8,66" fill="#374151"/>
    
    <!-- Outer Bulb Outline / Rays -->
    <line x1="0" y1="-75" x2="0" y2="-65" stroke="#374151" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="-55" y1="-55" x2="-45" y2="-45" stroke="#374151" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="55" y1="-55" x2="45" y2="-45" stroke="#374151" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="-70" y1="0" x2="-58" y2="0" stroke="#374151" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="70" y1="0" x2="58" y2="0" stroke="#374151" stroke-width="3.5" stroke-linecap="round"/>
    
    <!-- Left Brain (Orange Circuit) -->
    <path d="M-4,-55 C-22,-55 -48,-40 -48,-15 C-48,10 -35,22 -22,35 C-12,45 -8,48 -4,48 L-4,-55 Z" fill="#E65100"/>
    <!-- Orange Circuit Tracks -->
    <path d="M-10,-42 L-28,-42 L-28,-28 M-10,-20 L-38,-20 L-38,0 M-10,5 L-30,5 L-30,22 M-10,30 L-20,30" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="-28" cy="-28" r="3" fill="#FFFFFF"/>
    <circle cx="-38" cy="0" r="3" fill="#FFFFFF"/>
    <circle cx="-30" cy="22" r="3" fill="#FFFFFF"/>
    <circle cx="-20" cy="30" r="3" fill="#FFFFFF"/>
    <!-- Binary Code Overlay Left -->
    <text x="-22" y="-32" fill="#FFFFFF" font-family="monospace" font-size="7" font-weight="bold">101</text>
    <text x="-32" y="-10" fill="#FFFFFF" font-family="monospace" font-size="7" font-weight="bold">01010</text>
    <text x="-25" y="14" fill="#FFFFFF" font-family="monospace" font-size="7" font-weight="bold">101</text>

    <!-- Right Brain (Green Digital Code) -->
    <path d="M4,-55 C22,-55 48,-40 48,-15 C48,10 35,22 22,35 C12,45 8,48 4,48 L4,-55 Z" fill="#2E7D32"/>
    <!-- Green Digital Lines & Code -->
    <path d="M10,-42 L28,-42 M10,-20 L38,-20 M10,5 L30,5 M10,30 L20,30" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
    <text x="12" y="-32" fill="#FFFFFF" font-family="monospace" font-size="7" font-weight="bold">10101</text>
    <text x="12" y="-10" fill="#FFFFFF" font-family="monospace" font-size="7" font-weight="bold">010101</text>
    <text x="12" y="14" fill="#FFFFFF" font-family="monospace" font-size="7" font-weight="bold">01010</text>
    <text x="12" y="28" fill="#FFFFFF" font-family="monospace" font-size="7" font-weight="bold">1010</text>
  </g>
  
  <!-- "SIH" Text at Bottom -->
  <text x="100" y="180" text-anchor="middle" font-family="'Arial Black', sans-serif" font-size="28" font-weight="900" fill="#263238" letter-spacing="3">SIH</text>
</svg>
